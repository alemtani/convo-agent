name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Live tests (real Claude/Azure APIs) are excluded by pytest.ini's default
      # `-m "not live"`, so CI needs no API keys and spends nothing. The coverage
      # gate fails the build if backend coverage drops below 90%.
      - name: Run tests with coverage
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=90
