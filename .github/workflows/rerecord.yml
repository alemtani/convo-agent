name: re-record cassettes

# Cassettes are a recording of a model, and a model moves. This is where that
# staleness is handled: on a schedule, against live, off the PR path entirely.
#
# The alternative — a probabilistic live call on every PR — buys freshness with
# the one property the cassette layer exists to give CI: determinism. A build
# that is green 90% of the time is worse than one that is honestly stale.
on:
  schedule:
    # Weekly, Monday 06:00 UTC. The eval corpus is small and the models do not
    # move faster than that.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rerecord:
    runs-on: ubuntu-latest
    # The only job in this repo that spends money. It needs the key that the
    # test job deliberately does without, and it never runs on a pull request.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # `--refresh` replaces each recording rather than topping it up: the diff
      # against what is committed is the entire output of this job, and an
      # appended sample would bury it.
      #
      # `--samples 5` is what the dense-case gate needs to judge a *rate* rather
      # than a draw (`tests/test_coherence_eval.py`, DENSE_SAMPLES). Recording
      # fewer would make the gate cycle a short cassette and count the repeats.
      - name: Re-record the grader cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python -m evals.coherence.replay --record --refresh --samples 5
          --used-out "$RUNNER_TEMP/used-coherence.json"

      - name: Re-record the turn cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python -m evals.turn.replay --record --refresh --samples 5
          --used-out "$RUNNER_TEMP/used-turn.json"

      # One store, two runners. Neither reaches the other's keys, so neither can
      # decide alone what is stale — a runner that deleted what *it* did not
      # touch would take the other runner's whole corpus with it. The sweep
      # takes the union, and refuses if a manifest is missing, because a runner
      # that crashed must not read as "reached nothing".
      #
      # This is the only place it runs: the scheduled job is the one context
      # where every runner sweeps the whole corpus in the same pass.
      - name: Sweep recordings nothing reaches any more
        run: >
          python -m evals.cassette.sweep
          --used "$RUNNER_TEMP/used-coherence.json" "$RUNNER_TEMP/used-turn.json"

      - name: Show what moved
        run: git --no-pager diff --stat -- evals/cassettes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerecorded-cassettes
          path: evals/cassettes

      # A red scheduled job means "the model no longer says what the gate
      # asserts". Someone reads the diff and decides whether the eval or the
      # prompt is what changed; nothing is auto-committed, because a cassette
      # is evidence and evidence does not update itself.
      - name: Fail if the recording moved
        run: git diff --exit-code -- evals/cassettes
