name: live suite

# The half of the old `live` marker a recording cannot stand in for: a real
# `cache_read_input_tokens`, and Azure. It spends money and needs keys that CI
# deliberately does without, so it cannot be a merge gate — it runs here, on a
# schedule, off the PR path entirely.
#
# A0.6 found every Anthropic test under that marker broken, because a suite
# excluded from every run is a suite nobody runs. This job is what makes that
# impossible a second time. A red scheduled run is the entire mechanism;
# `continue-on-error` is deliberately not set.
#
# Cassette re-recording used to ride this same schedule. It does not any more:
# a cassette is re-recorded on demand, in the PR that changes what it records,
# where someone is already reading the diff.
on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Every one of these tests skips itself when its key is absent, which is
      # a second way to rot unnoticed: a green run that asserted nothing. So
      # the keys are checked here, where a missing one fails with a name.
      - name: Check the keys are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          missing=
          for name in ANTHROPIC_API_KEY AZURE_SPEECH_KEY AZURE_SPEECH_REGION; do
            printenv "$name" | grep -q . || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::live suite would skip silently — missing:$missing"
            exit 1
          fi

      # `-rs` so a skip is named rather than folded into the summary count. An
      # Azure 401 surfaces here first, and it usually means the subscription
      # lapsed rather than the code broke.
      - name: Run the live suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: pytest -m live -rs
