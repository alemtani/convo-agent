[pytest]
asyncio_mode = auto
testpaths = tests
# Put the repo root on sys.path so `import backend` works regardless of how
# pytest is launched — `python -m pytest` (Stop hook) adds the CWD, but the bare
# `pytest` console script (CI) does not.
pythonpath = .
markers =
    live: hits real Claude/Azure APIs; needs keys and costs money. Contact tests
        only — cache_read_input_tokens, Azure STT/PA/TTS. Run with `pytest -m live`.
        The scheduled re-record job is what runs these; CI does not.
    cassette: behavioral evals over recorded Anthropic responses. Deterministic,
        free, and in the default gate. Re-record with `pytest -m cassette --record`.
    smoke: drives the frontend in a real browser (Playwright). Deterministic, but needs
        a browser install, so it's kept out of the default run. Run with `pytest -m smoke`.
# Default run is offline (or cassette-replayed) and browserless. `live` is
# excluded because it costs money and its claim is the contact itself; `smoke`
# only because it needs a Chromium install — it *is* deterministic, and CI runs
# it in its own job. Cassette-backed evals are *not* excluded: they are the
# merge gate. `pytest -m live` / `pytest -m smoke` override this.
addopts = -m "not live and not smoke"
