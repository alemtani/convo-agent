[pytest]
asyncio_mode = auto
testpaths = tests
# Put the repo root on sys.path so `import backend` works regardless of how
# pytest is launched — `python -m pytest` (Stop hook) adds the CWD, but the bare
# `pytest` console script (CI) does not.
pythonpath = .
markers =
    live: touches a real API on purpose — needs keys and costs money. Run with `pytest -m live`.
        The bar for this marker is narrow (A0.6): a test earns it only when a recording
        cannot stand in for the real call. `cache_read_input_tokens > 0` is the sharp
        case — replaying a recorded 850 proves someone once wrote 850 into a JSON file —
        and Azure, which the cassette layer does not wrap at all. Structural invariants
        over model output belong on cassettes instead (`tests/test_worker_behavior.py`),
        where they run in CI for free and are a merge gate.
    smoke: drives the frontend in a real browser (Playwright). Deterministic, but needs
        a browser install, so it's kept out of the default run. Run with `pytest -m smoke`.
# Default run is offline, mocked, and browserless. `live` is excluded because it
# costs money; `smoke` only because it needs a Chromium install — it *is*
# deterministic, and CI runs it in its own job. `pytest -m live` /
# `pytest -m smoke` override this.
#
# An excluded suite rots (A0.6: every Anthropic test under `live` had been
# broken since the grader split, and nothing noticed). So exclusion now comes
# with a schedule: `.github/workflows/rerecord.yml` runs `pytest -m live`
# weekly against real keys, and fails loudly when a key is missing rather than
# letting the tests skip themselves green.
addopts = -m "not live and not smoke"
