<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Convo Agent</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 7rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.25rem; }
    .muted { opacity: 0.6; font-size: 0.85rem; }

    #thread { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    .bubble {
      padding: 0.6rem 0.85rem;
      border-radius: 1rem;
      max-width: 80%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: #0b7;
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }
    .bubble.partner {
      align-self: flex-start;
      background: rgba(127, 127, 127, 0.18);
      border-bottom-left-radius: 0.25rem;
    }
    .bubble .zh { font-size: 1.15rem; }
    .bubble .pinyin { opacity: 0.7; font-size: 0.85rem; }
    .bubble.empty { font-style: italic; opacity: 0.6; }

    /* Per-syllable tone scores: white text on the green user bubble, with a
       colored underline encoding Azure's accuracy (green good / amber ok / red off). */
    .bubble .zh.scored,
    .bubble .pinyin.scored { display: flex; flex-wrap: wrap; gap: 0.3rem; opacity: 1; }
    .bubble .syl { border-bottom: 3px solid transparent; line-height: 1.3; }
    .bubble .syl.tone-good { border-color: #4ade80; }
    .bubble .syl.tone-mid  { border-color: #fbbf24; }
    .bubble .syl.tone-bad  { border-color: #f87171; }
    /* Keep the last message clear of the fixed dock when scrolled into view. */
    .bubble:last-child { scroll-margin-bottom: 6rem; }
    .bubble .score-badge {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.7rem;
      padding: 0.05rem 0.45rem;
      border-radius: 1rem;
      background: rgba(0, 0, 0, 0.25);
    }

    #dock {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 1rem;
      background: Canvas;
      border-top: 1px solid rgba(127, 127, 127, 0.3);
    }
    #talk {
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border-radius: 2rem;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    #talk.recording { background: #d33; color: #fff; border-color: #d33; }
    #talk:disabled { opacity: 0.5; cursor: default; }
    #reset {
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 1rem;
      border: 1px solid rgba(127, 127, 127, 0.4);
      background: transparent;
      color: inherit;
      opacity: 0.7;
      cursor: pointer;
    }
    #status { font-size: 0.8rem; opacity: 0.7; min-height: 1rem; }

    /* Live mic-level meter — visible only while recording (see #meter.active). */
    #meter {
      width: 12rem;
      height: 0.4rem;
      border-radius: 0.4rem;
      background: rgba(127, 127, 127, 0.25);
      overflow: hidden;
      visibility: hidden;
    }
    #meter.active { visibility: visible; }
    #meter-fill {
      height: 100%;
      width: 0%;
      background: #d33;
      border-radius: inherit;
      transform-origin: left;
    }
  </style>
</head>
<body>
  <h1>Convo Agent</h1>
  <p class="muted">Phase 3b — hold the button and speak Mandarin (greetings). A real partner replies and remembers the conversation; your words come back with per-syllable tone scores (green good / amber ok / red off).</p>

  <div id="thread"></div>

  <div id="dock">
    <button id="talk">🎙️ Hold to talk</button>
    <button id="reset" title="Start a new conversation">↺ New</button>
    <div id="meter"><div id="meter-fill"></div></div>
    <div id="status"></div>
  </div>

  <script>
    const talk = document.getElementById("talk");
    const reset = document.getElementById("reset");
    const thread = document.getElementById("thread");
    const status = document.getElementById("status");
    const meter = document.getElementById("meter");
    const meterFill = document.getElementById("meter-fill");

    const TARGET_RATE = 16000;
    let audioCtx, stream, sourceNode, recorderNode, scriptNode;
    let analyserNode, meterRaf;
    let chunks = [];
    let recording = false;

    // Stateless server: the client holds the running transcript and resubmits it
    // each turn so the partner has memory. Each entry is {role, zh, pinyin}; we
    // send only {role, zh} (the wire contract) and keep pinyin for re-rendering.
    const STORE_KEY = "convo.dialogue.greetings";
    let dialogue = loadDialogue();

    function loadDialogue() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch (_) { return []; }
    }
    function saveDialogue() {
      localStorage.setItem(STORE_KEY, JSON.stringify(dialogue));
    }

    function setStatus(msg) { status.textContent = msg; }

    function addBubble(role) {
      const el = document.createElement("div");
      el.className = "bubble " + role;
      thread.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
      return el;
    }

    // Both sides render the same way: 汉字 on top, pinyin beneath. When tone
    // scores are present (the user's turn), render per syllable instead.
    function renderLine(role, utt, emptyText, pronunciation) {
      const el = addBubble(role);
      if (!utt.zh) {
        el.classList.add("empty");
        el.textContent = emptyText;
        return;
      }
      if (pronunciation && pronunciation.syllables.length) {
        renderScored(el, pronunciation);
        return;
      }
      el.innerHTML = '<div class="zh"></div><div class="pinyin"></div>';
      el.querySelector(".zh").textContent = utt.zh;
      el.querySelector(".pinyin").textContent = utt.pinyin;
    }

    function toneClass(accuracy) {
      if (accuracy >= 80) return "tone-good";
      if (accuracy >= 60) return "tone-mid";
      return "tone-bad";
    }

    // 汉字 and pinyin rows split into per-syllable spans, each underlined by its
    // accuracy (which folds in tone correctness), then an overall-score badge.
    function renderScored(el, pron) {
      const zhRow = document.createElement("div");
      zhRow.className = "zh scored";
      const pyRow = document.createElement("div");
      pyRow.className = "pinyin scored";
      for (const s of pron.syllables) {
        const cls = "syl " + toneClass(s.accuracy);
        const title = s.pinyin + " · " + Math.round(s.accuracy);
        for (const [row, text] of [[zhRow, s.hanzi], [pyRow, s.pinyin]]) {
          const span = document.createElement("span");
          span.className = cls;
          span.textContent = text;
          span.title = title;
          row.appendChild(span);
        }
      }
      const badge = document.createElement("span");
      badge.className = "score-badge";
      badge.textContent = "tone " + Math.round(pron.overall) + "/100";
      el.append(zhRow, pyRow, badge);
    }

    async function startRecording() {
      if (recording) return;
      // The mic API only exists in a secure context. Browsers count https:// and
      // localhost/127.0.0.1 as secure, but NOT 0.0.0.0 or a LAN IP — opening the
      // page there leaves navigator.mediaDevices undefined. Guard it with an
      // actionable hint instead of a raw "undefined" TypeError.
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus(
          "microphone unavailable — open this page at http://localhost:8000 " +
          "(not 0.0.0.0 or a LAN IP), or serve it over HTTPS."
        );
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        setStatus("microphone blocked: " + err);
        return;
      }
      recording = true;
      chunks = [];
      talk.classList.add("recording");
      talk.textContent = "● Recording… release to send";
      setStatus("");

      // Ask for 16 kHz directly; we still downsample defensively from the
      // context's actual rate in case the browser ignores the hint.
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({
        sampleRate: TARGET_RATE,
      });
      sourceNode = audioCtx.createMediaStreamSource(stream);
      startMeter();

      const pushFrame = (frame) => { if (recording) chunks.push(frame); };

      let usedWorklet = false;
      if (audioCtx.audioWorklet) {
        try {
          await audioCtx.audioWorklet.addModule("/recorder-worklet.js");
          recorderNode = new AudioWorkletNode(audioCtx, "recorder-processor");
          recorderNode.port.onmessage = (e) => pushFrame(e.data);
          sourceNode.connect(recorderNode).connect(audioCtx.destination);
          usedWorklet = true;
        } catch (_) { usedWorklet = false; }
      }
      if (!usedWorklet) {
        // Fallback: ScriptProcessorNode (deprecated but universally available).
        scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
        scriptNode.onaudioprocess = (e) =>
          pushFrame(e.inputBuffer.getChannelData(0).slice(0));
        sourceNode.connect(scriptNode).connect(audioCtx.destination);
      }
    }

    async function stopRecording() {
      if (!recording) return;
      recording = false;
      talk.classList.remove("recording");
      talk.textContent = "🎙️ Hold to talk";

      const inRate = audioCtx ? audioCtx.sampleRate : TARGET_RATE;
      cleanupAudio();

      const samples = downsample(flatten(chunks), inRate, TARGET_RATE);
      chunks = [];
      if (samples.length === 0) { setStatus("no audio captured"); return; }

      const wav = encodeWav(samples, TARGET_RATE);
      await sendTurn(wav);
    }

    // Live mic-level meter: tap an AnalyserNode off the source (a sink — never
    // routed to destination) and animate the bar from the signal's RMS. For the
    // recording window only; stopMeter resets it on release.
    function startMeter() {
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 1024;
      sourceNode.connect(analyserNode);
      const buf = new Float32Array(analyserNode.fftSize);
      meter.classList.add("active");
      const tick = () => {
        if (!recording || !analyserNode) return;
        analyserNode.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        // Map RMS to a width; the *3 gain makes normal speech fill the bar.
        meterFill.style.width = Math.min(100, rms * 300) + "%";
        meterRaf = requestAnimationFrame(tick);
      };
      meterRaf = requestAnimationFrame(tick);
    }

    function stopMeter() {
      if (meterRaf) cancelAnimationFrame(meterRaf);
      if (analyserNode) analyserNode.disconnect();
      meterRaf = analyserNode = null;
      meter.classList.remove("active");
      meterFill.style.width = "0%";
    }

    function cleanupAudio() {
      stopMeter();
      if (recorderNode) { recorderNode.port.onmessage = null; recorderNode.disconnect(); }
      if (scriptNode) { scriptNode.onaudioprocess = null; scriptNode.disconnect(); }
      if (sourceNode) sourceNode.disconnect();
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (audioCtx) audioCtx.close();
      recorderNode = scriptNode = sourceNode = stream = audioCtx = null;
    }

    function flatten(frames) {
      let len = 0;
      for (const f of frames) len += f.length;
      const out = new Float32Array(len);
      let off = 0;
      for (const f of frames) { out.set(f, off); off += f.length; }
      return out;
    }

    // Linear-interpolation resample to 16 kHz (no-op when already at target).
    function downsample(samples, inRate, outRate) {
      if (inRate === outRate || samples.length === 0) return samples;
      const ratio = inRate / outRate;
      const outLen = Math.floor(samples.length / ratio);
      const out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const pos = i * ratio;
        const lo = Math.floor(pos);
        const hi = Math.min(lo + 1, samples.length - 1);
        out[i] = samples[lo] + (samples[hi] - samples[lo]) * (pos - lo);
      }
      return out;
    }

    // Mono 16-bit PCM WAV (44-byte header + samples).
    function encodeWav(samples, rate) {
      const buf = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const writeStr = (off, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);        // PCM chunk size
      view.setUint16(20, 1, true);         // audio format = PCM
      view.setUint16(22, 1, true);         // channels = mono
      view.setUint32(24, rate, true);      // sample rate
      view.setUint32(28, rate * 2, true);  // byte rate (rate * blockAlign)
      view.setUint16(32, 2, true);         // block align (channels * bytes)
      view.setUint16(34, 16, true);        // bits per sample
      writeStr(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let off = 44;
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        off += 2;
      }
      return new Blob([view], { type: "audio/wav" });
    }

    async function sendTurn(wavBlob) {
      setStatus("transcribing…");
      talk.disabled = true;
      const form = new FormData();
      form.append("audio", wavBlob, "turn.wav");
      form.append("topic_id", "greetings");
      // Send prior turns (role + zh only) so the partner has memory.
      form.append("dialogue", JSON.stringify(
        dialogue.map((t) => ({ role: t.role, zh: t.zh }))
      ));
      try {
        const resp = await fetch("/api/turn", { method: "POST", body: form });
        if (!resp.ok) {
          const detail = await resp.text();
          setStatus("error " + resp.status + ": " + detail);
          return;
        }
        const data = await resp.json();
        renderLine("user", data.transcript, "(nothing recognized)", data.pronunciation);
        renderLine("partner", data.reply, "");
        // Only record a real exchange: an empty transcript means nothing was
        // recognized (the reply was a re-prompt), so it isn't part of history.
        if (data.transcript.zh) {
          dialogue.push({ role: "user", zh: data.transcript.zh, pinyin: data.transcript.pinyin });
          dialogue.push({ role: "partner", zh: data.reply.zh, pinyin: data.reply.pinyin });
          saveDialogue();
        }
        setStatus("");
      } catch (err) {
        setStatus("request failed: " + err);
      } finally {
        talk.disabled = false;
      }
    }

    // Restore the running transcript on load (scores are per-turn, not persisted).
    function restoreThread() {
      for (const t of dialogue) {
        renderLine(t.role, { zh: t.zh, pinyin: t.pinyin || "" }, "");
      }
    }

    // New conversation: clear memory and the thread so the partner starts fresh.
    reset.addEventListener("click", () => {
      dialogue = [];
      localStorage.removeItem(STORE_KEY);
      thread.innerHTML = "";
      setStatus("new conversation");
    });

    restoreThread();

    // Hold-to-talk: press to start, release (or leave the button) to send.
    talk.addEventListener("pointerdown", (e) => { e.preventDefault(); startRecording(); });
    talk.addEventListener("pointerup", (e) => { e.preventDefault(); stopRecording(); });
    talk.addEventListener("pointercancel", () => stopRecording());
  </script>
</body>
</html>
