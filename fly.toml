# Fly.io app config. `fly launch`/`fly deploy` touch account credentials and
# are run by hand (see README#deploying) — this file is the config, not the
# deploy. Rename `app` to whatever `fly apps create` gives you.
app = "convo-agent"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # One machine stays up. Scaling to zero costs a ~5s cold start on the first
  # request, and that request is the learner opening the app: the page load
  # itself is what wakes the machine, so the session call behind it races a
  # server that isn't listening yet. A beginner reads that as "broken", not
  # "waking up". The second machine still auto-starts under load, so this buys
  # latency, not capacity — and a machine that is always serving someone never
  # idles down anyway, so the cost only looks like a cost while nobody is here.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# No [mounts]/persistent volume — SQLite is cut from MVP scope (durable
# per-user state is Phase 4+, still to be designed for a volume or a hosted
# DB). Every deploy is stateless disk-wise; state that must survive a restart
# lives in Anthropic/Azure or not at all yet.
